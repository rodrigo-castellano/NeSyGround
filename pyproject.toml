[project]
name = "grounder"
version = "0.1.0"
description = "NeSyGround: Compiled CUDA-graph-safe FOL grounding for neuro-symbolic reasoning"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "torch-kge-kernels @ git+https://github.com/rodrigo-castellano/torch-kge-kernels.git@1cdf8976fb08629c92da33ea441857834c30b155",
]
license = "MIT"
readme = "README.md"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

# The repo root IS the `grounder` package: __init__.py and the modules
# sit at the root and the subpackages are siblings. We map "grounder" -> "."
# and each subpackage explicitly so consumers can `import grounder` after a
# normal `pip install`.
[tool.setuptools]
# ``grounder`` maps to the repo root ("."), so root modules (core.py) are
# auto-included as ``grounder.core``.
packages = [
    "grounder",
    "grounder.api",
    "grounder.base",
    "grounder.vocab",
    "grounder.backward",
    "grounder.forward",
    "grounder.forward.spmm",
    "grounder.forward.staged",
    "grounder.resolution",
    "grounder.resolution.pbc",
    "grounder.data",
    "grounder.data.fact_index",
    "grounder.data.rule_index",
    "grounder.execution",
    "grounder.filters",
]

[tool.setuptools.package-dir]
"grounder" = "."
"grounder.api" = "api"
"grounder.base" = "base"
"grounder.vocab" = "vocab"
"grounder.backward" = "backward"
"grounder.forward" = "forward"
"grounder.forward.spmm" = "forward/spmm"
"grounder.forward.staged" = "forward/staged"
"grounder.resolution" = "resolution"
"grounder.resolution.pbc" = "resolution/pbc"
"grounder.data" = "data"
"grounder.data.fact_index" = "data/fact_index"
"grounder.data.rule_index" = "data/rule_index"
"grounder.execution" = "execution"
"grounder.filters" = "filters"
