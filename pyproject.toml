[project]
name = "grounder"
version = "0.1.0"
description = "NeSyGround: Compiled CUDA-graph-safe FOL grounding for neuro-symbolic reasoning"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
]
license = "MIT"
readme = "README.md"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

# The repo root IS the `grounder` package: __init__.py and the modules
# sit at the root and the subpackages are siblings. We map "grounder" -> "."
# and each subpackage explicitly so consumers can `import grounder` after a
# normal `pip install`.
[tool.setuptools]
# ``grounder`` maps to the repo root ("."), so root modules (kb.py, ops.py, types.py) are ``grounder.kb`` etc.
packages = [
    "grounder",
    "grounder.api",
    "grounder.sld",
    "grounder.pbc",
    "grounder.forward",
    "grounder.forward.spmm",
    "grounder.forward.join",
]

[tool.setuptools.package-dir]
"grounder" = "."
"grounder.api" = "api"
"grounder.sld" = "sld"
"grounder.pbc" = "pbc"
"grounder.forward" = "forward"
"grounder.forward.spmm" = "forward/spmm"
"grounder.forward.join" = "forward/join"
