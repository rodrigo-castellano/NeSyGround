[project]
name = "grounder"
version = "0.1.0"
description = "NeSyGround: Compiled CUDA-graph-safe FOL grounding for neuro-symbolic reasoning"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "torch-kge-kernels @ git+https://github.com/rodrigo-castellano/torch-kge-kernels.git@8311aa66372946c673bb8cd18c52ac92d3b844f6",
]
license = "MIT"
readme = "README.md"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

# The repo root IS the `grounder` package: __init__.py and the modules
# (factory.py, types.py, utils.py, config.py, glossary.py, errors.py,
# shapes.py) sit at the root, and the subpackages (backward/, forward/,
# resolution/, data/, core/, execution/, transform/, filters/, nesy/,
# grounder/, memo/, contracts/) are siblings. We map "grounder" -> "." and
# each subpackage explicitly so consumers can `import grounder` and
# `from grounder.forward.grounder import ForwardGrounder` after a normal
# `pip install`.
[tool.setuptools]
# ``grounder`` maps to the repo root ("."), so root modules (core.py) are
# auto-included as ``grounder.core``. The redesign layout is api/base/vocab +
# core.py (no core/ or grounder/ dirs — those were the pre-redesign layout).
packages = [
    "grounder",
    "grounder.api",
    "grounder.base",
    "grounder.vocab",
    "grounder.backward",
    "grounder.forward",
    "grounder.forward.spmm",
    "grounder.forward.staged",
    "grounder.resolution",
    "grounder.resolution.pbc",
    "grounder.data",
    "grounder.data.fact_index",
    "grounder.data.rule_index",
    "grounder.execution",
    "grounder.transform",
    "grounder.filters",
    "grounder.nesy",
    "grounder.memo",
    "grounder.contracts",
    "grounder.analysis",
]

[tool.setuptools.package-dir]
"grounder" = "."
"grounder.api" = "api"
"grounder.base" = "base"
"grounder.vocab" = "vocab"
"grounder.backward" = "backward"
"grounder.forward" = "forward"
"grounder.forward.spmm" = "forward/spmm"
"grounder.forward.staged" = "forward/staged"
"grounder.resolution" = "resolution"
"grounder.resolution.pbc" = "resolution/pbc"
"grounder.data" = "data"
"grounder.data.fact_index" = "data/fact_index"
"grounder.data.rule_index" = "data/rule_index"
"grounder.execution" = "execution"
"grounder.transform" = "transform"
"grounder.filters" = "filters"
"grounder.nesy" = "nesy"
"grounder.memo" = "memo"
"grounder.contracts" = "contracts"
"grounder.analysis" = "analysis"
